<!DOCTYPE html>
<html>
    <head lang="en">
        <meta charset="UTF-8">
        <title>Send a message</title>
    </head>
    <body>
        <style>
            .form {
                width: 100%;
                display: inline-block;
               /* border: 1px solid rgba(25, 25, 25, 0.32); */
            }

            .message {
                color: black;
                border: 1px solid; 
                border-radius: 4px;
                margin: 4px 0;
                padding: 4px;
            }

            .history {
                color: black;
                /* border: 1px solid; */
                border-radius: 4px;
                margin: 4px 0;
                padding: 4px;
            }

            button {
                display: block;
                width: 100%;
                border: none;
                border-radius: 4px;
                padding: 8px;
                margin-top: 4px;
                background: #007bff;
                color: #fff;
                cursor: pointer;
              }

            button:hover {
                background: #0069d9;
               }

            input {
                border: 1px solid rgba(25, 25, 25, 0.32);
                outline: none;
                width: calc(100% - 2px);
            }
        </style>
        <form class="form" action="/">
            <div class="message">История сообщений</div>
            <div class="history"></div>
            <input class="form-input" name="message-text" placeholder="Введите сообщение" type="text">
            <button type="submit" >Отправить</button>
            <button type="button" class="clear-btn">Очистить историю</button>
        </form>
        <script>
            const STORAGE_KEY = 'messages';

            const form = document.querySelector('form');
            const input = document.querySelector('.form-input');
            const history = document.querySelector('.history');
            const clearBtn = document.querySelector('.clear-btn');
            

function loadMessages() {
    try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch {
        return [];
    }
}

function saveMessages(messages) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(messages.slice(-50)));
}

function handleSubmit(event) {
    event.preventDefault();

    const text = input.value.trim();
    if (!text) return;

    const messages = loadMessages();
    messages.push(text);
    saveMessages(messages);

    input.value = '';
    renderMessages();
}

function renderMessages() {
    history.innerText = '';
    loadMessages().forEach((text) => {
        const div = document.createElement('div');
        div.className = 'massage';
        div.innerText = text;
        history.appendChild(div);
    });
}

form.addEventListener('submit', handleSubmit);
renderMessages();

clearBtn.addEventListener('click', () => {
    if (confirm('Удалить всю историю?'))
    localStorage.removeItem(STORAGE_KEY);
    renderMessages(); 
});
        </script>
    </body>
</html>
