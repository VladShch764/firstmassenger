<!DOCTYPE html>
<html>
    <head lang="en">
        <meta charset="UTF-8">
        <title>Send a message</title>
    <link href="style.css" rel="stylesheet"></head>
    <body>
        <style>
            .form {
                width: 100%;
                display: inline-block;
               /* border: 1px solid rgba(25, 25, 25, 0.32); */
            }

            .message {
                color: black;
                border: 1px solid; 
                border-radius: 4px;
                margin: 4px 0;
                padding: 4px;
            }

            .history {
                color: black;
                /* border: 1px solid; */
                border-radius: 4px;
                margin: 4px 0;
                padding: 4px;
            }

            button {
                display: block;
                width: 100%;
                border: none;
                border-radius: 4px;
                padding: 8px;
                margin-top: 4px;
                background: #007bff;
                color: #fff;
                cursor: pointer;
              }

            button:hover {
                background: #0069d9;
               }

            input {
                border: 1px solid rgba(25, 25, 25, 0.32);
                outline: none;
                width: calc(100% - 2px);
            }
        </style>
        <form class="form" action="/">
            <div class="message">История сообщений</div>
            <div class="history"></div>
            <input class="form-input" name="message-text" placeholder="Введите сообщение" type="text">
            <button type="submit" >Отправить</button>
            <button type="button" class="clear-btn">Очистить историю</button>
        </form>
        <script type="module" src="./index.js" />  
           
    <script type="text/javascript" src="bundle.js"></script></body>
</html>
